name: Native analysis and offline dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, Release, Sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build libssl-dev python3
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = Sanitizers ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTRACETRUST_SANITIZERS=ON
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.mode }}
          fi
      - run: cmake --build build --parallel 2
      - name: CTest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
  quality-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build libssl-dev python3-venv cppcheck
      - name: Development tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Format and JavaScript syntax
        run: |
          .venv/bin/clang-format --dry-run --Werror include/tracetrust/*.hpp src/*.cpp src/*/*.cpp tests/tests.cpp
          node --check dashboard/app.js
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - name: Static checks (project code)
        run: cppcheck --project=build/compile_commands.json --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem '--suppress=*:*/third_party/*' --error-exitcode=1 --max-configs=1
      - name: Reproduce synthetic capture bytes
        run: |
          .venv/bin/python tools/generate_fixtures.py --output regenerated
          diff -r examples/captures regenerated
      - name: Offline browser integration
        run: .venv/bin/python tests/dashboard_test.py --executable build/tracetrust
